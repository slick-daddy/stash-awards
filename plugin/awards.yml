# Stash plugin manifest. The schema lives in Stash's pkg/plugin/config.go and is
# parsed strictly, so every key here is one Stash knows. The id Stash addresses
# the plugin by is the file name: awards.
name: Stash Awards
description: Collects performer award nominations, wins and hall-of-fame inductions from IAFD and AdultIndustryAwards, caches them locally and shows them on a dedicated page inside Stash.
version: 0.1.0
url: https://github.com/slick-daddy/stash-awards

# The Go binary speaks the raw stdin/stdout JSON protocol; "js" would make Stash
# look for a script instead.
interface: raw
exec:
  - stash-awards

tasks:
  - name: Sync due performers
    description: Refreshes award data for linked performers whose scheduled sync has come around. Respects the auto-sync setting.
    defaultArgs:
      mode: syncDue
      requireAutoSync: "true"
  - name: Sync due performers now
    description: Refreshes award data for linked performers whose scheduled sync has come around, whether or not auto-sync is enabled.
    defaultArgs:
      mode: syncDue
  - name: Sync all performers
    description: Refreshes award data for every performer in the library. A long run against rate-limited sources.
    defaultArgs:
      mode: syncAll

hooks:
  - name: Forget deleted performer
    description: Drops everything cached about a performer when it is deleted from Stash.
    triggeredBy:
      - Performer.Destroy.Post
    defaultArgs:
      mode: forgetPerformer

ui:
  javascript:
    - awards.js
  css:
    - awards.css

settings:
  autoSyncEnabled:
    displayName: Auto-sync
    description: Refresh award data in the background when it comes due. The plugin runs with this off by default; turn it on if you want scheduled syncs.
    type: BOOLEAN
  syncIntervalDays:
    displayName: Sync interval (days)
    description: Days between automatic refreshes of one performer. The plugin uses 30 by default when this is left empty; clamp at 1 to 3650.
    type: NUMBER
  iafdEnabled:
    displayName: Use IAFD
    description: Search and show awards from IAFD. The plugin enables this by default.
    type: BOOLEAN
  aiaEnabled:
    displayName: Use AdultIndustryAwards
    description: Search and show awards from AdultIndustryAwards. The plugin enables this by default.
    type: BOOLEAN
  iafdDelayMs:
    displayName: IAFD delay (ms)
    description: Minimum spacing between requests to IAFD, which rate limits rapid requests. The plugin uses 2000 ms by default when this is left empty; clamp at 100 to 600000.
    type: NUMBER
  aiaDelayMs:
    displayName: AdultIndustryAwards delay (ms)
    description: Minimum spacing between requests to AdultIndustryAwards. The plugin uses 500 ms by default when this is left empty; clamp at 100 to 600000.
    type: NUMBER
