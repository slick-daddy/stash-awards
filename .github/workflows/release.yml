name: Release plugin

# Builds the Stash Awards plugin for every supported platform, packages it the
# way Stash's package manager expects (a zip of the manifest, UI bundle and the
# compiled binary), publishes those zips as a GitHub release, and rewrites
# index.yml with the release URLs and sha256 sums so the in-app "Add Source"
# install works.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: ".exe"
            id: awards
          - goos: linux
            goarch: amd64
            ext: ""
            id: awards-linux-amd64
          - goos: linux
            goarch: arm64
            ext: ""
            id: awards-linux-arm64
          - goos: darwin
            goarch: amd64
            ext: ""
            id: awards-macos-amd64
          - goos: darwin
            goarch: arm64
            ext: ""
            id: awards-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI bundle
        working-directory: ui
        run: npm ci && npm run build

      - name: Build backend binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o stash-awards${{ matrix.ext }} .

      - name: Stage and zip plugin package
        run: |
          mkdir -p dist
          cp plugin/awards.yml dist/
          cp plugin/awards.js dist/
          cp plugin/awards.css dist/
          cp stash-awards${{ matrix.ext }} dist/stash-awards${{ matrix.ext }}
          if [ "${{ matrix.goos }}" != "windows" ]; then chmod +x dist/stash-awards${{ matrix.ext }}; fi
          (cd dist && zip -r "../stash-awards-${{ matrix.goos }}-${{ matrix.goarch }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: stash-awards-${{ matrix.goos }}-${{ matrix.goarch }}
          path: stash-awards-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  release:
    name: Publish release and refresh index
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate index.yml
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S +0000")
          VERSION="${GITHUB_REF_NAME#v}"
          : "${VERSION:=0.0.0-dev}"
          REPO="${{ github.repository }}"
          DESC="Collects performer award nominations, wins and hall-of-fame inductions from IAFD and AdultIndustryAwards, caches them locally and shows them on a dedicated page inside Stash."

          {
            echo "# Stash package index for Stash Awards."
            echo "# Source URL: https://raw.githubusercontent.com/${REPO}/main/index.yml"
            echo "# Regenerated by .github/workflows/release.yml on each release."
          } > index.yml

          for f in artifacts/stash-awards-*.zip; do
            base=$(basename "$f")
            os=$(echo "$base" | sed -E 's/stash-awards-([a-z]+)-([a-z0-9]+)\.zip/\1/')
            arch=$(echo "$base" | sed -E 's/stash-awards-([a-z]+)-([a-z0-9]+)\.zip/\2/')
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            url="https://github.com/${REPO}/releases/latest/download/${base}"

            id="awards"
            name="Stash Awards"
            case "$os" in
              linux)  id="awards-linux-${arch}";  name="Stash Awards (Linux/${arch})" ;;
              darwin) id="awards-macos-${arch}";  name="Stash Awards (macOS/${arch})" ;;
            esac

            {
              echo "- id: ${id}"
              echo "  name: ${name}"
              echo "  version: ${VERSION}"
              echo "  date: ${DATE}"
              echo "  path: ${url}"
              echo "  sha256: ${sum}"
              echo "  metadata:"
              echo "    description: ${DESC}"
            } >> index.yml
          done

      - name: Show generated index.yml
        run: cat index.yml

      - name: Commit refreshed index.yml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add index.yml
          git diff --cached --quiet || git commit -m "chore: regenerate index.yml for ${GITHUB_REF_NAME}"
          git push origin HEAD:refs/heads/main

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/stash-awards-*.zip
          generate_release_notes: true
